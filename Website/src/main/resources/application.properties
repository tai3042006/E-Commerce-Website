server.port=${PORT:4000}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://127.0.0.1:3306/clofit?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:java-schema.sql
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
clofit.admin.email=${ADMIN_EMAIL:}
clofit.admin.password=${ADMIN_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
